
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trackly | Staff Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ede9fe, #c4b5fd, #f5f3ff);
}

.login-card {
    background: white;
    width: 100%;
    max-width: 410px;
    padding: 38px 32px;
    border-radius: 22px;
    box-shadow: 0 15px 45px rgba(76, 29, 149, 0.18);
    text-align: center;
}

.logo {
    width: 65px;
    height: 65px;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    color: white;
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
    font-size: 30px;
}

h1 {
    color: #5b21b6;
    margin: 0 0 8px;
    font-size: 29px;
}

.subtitle {
    color: #777;
    margin-bottom: 28px;
    line-height: 1.6;
    font-size: 14px;
}

.field {
    text-align: left;
    margin-bottom: 18px;
}

label {
    display: block;
    color: #3b245f;
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd6fe;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #7c3aed;
    box-shadow: 0 0 0 3px #ede9fe;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    color: white;
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px #ddd6fe;
}

#message {
    min-height: 20px;
    color: #dc2626;
    font-size: 14px;
    margin-top: 15px;
}

.footer {
    color: #888;
    font-size: 12px;
    margin-top: 22px;
}
</style>
</head>

<body>
<div class="login-card">
    <div class="logo">✈</div>

    <h1>Trackly</h1>
    <p class="subtitle">
        Lost Luggage Tracking System<br>
        Staff Portal
    </p>

    <form id="loginForm">
        <div class="field">
            <label for="username">Staff Username</label>
            <input type="text" id="username"
                   placeholder="Enter username" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Enter password" required>
        </div>

        <button type="submit">Login to Dashboard →</button>
        <p id="message" role="alert"></p>
    </form>

    <p class="footer">Trackly · Staff Access Portal</p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (username === "staff" && password === "trackly123") {
        sessionStorage.setItem("tracklyLoggedIn", "true");
        window.location.href = "dashboard.html";
    } else {
        message.textContent = "Invalid username or password. Please try again.";
    }
});
</script>
</body>
</html>
